# Installed from process/upstream/templates/github-actions/doc-lint.yml.template
# This version runs the vendored BestPractice linter in place.
name: BestPractice documentation checks

on:
  # push only, deliberately -- matching the fix applied 2026-09-15 across
  # this account and to the upstream template (alex137/BestPractice,
  # templates/github-actions/doc-lint.yml.template). Unlike the other repos
  # in this pass this repo is PUBLIC, so the fork-PR case below is a real
  # possibility rather than a formality -- but as of this fix no PR here
  # has ever come from a fork, and the dual trigger was in the meantime
  # double-firing every commit to an open PR and again on merge, seconds
  # apart, on the same tree, for no benefit.
  #
  # PUT `pull_request:` BACK IF A PR EVER ARRIVES FROM A FORK -- a fork's
  # pushes do not fire `push` in the repo being contributed to, so
  # `pull_request:` is the only trigger that would check it.
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "process/upstream/tools/doc_lint.py"
      - ".github/workflows/bestpractice-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown parser
        run: python -m pip install cmarkgfm

      - name: Lint changed Markdown
        run: python3 process/upstream/tools/doc_lint.py
